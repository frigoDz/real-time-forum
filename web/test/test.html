<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <title>Document</title>
    <style>
        /* Base Reset & Global Styles */
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  background-color: var(--bg-primary);
  color: var(--text-main);
  font-family: var(--font-main);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
  line-height: 1.5;
}

#app {
  width: 100%;
  min-height: 100vh;
}

/* Accessibility Utility */
.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border-width: 0;
}

/* Scrollbar Styling */
::-webkit-scrollbar {
  width: 6px;
  height: 6px;
}
::-webkit-scrollbar-track {
  background: var(--bg-primary);
}
::-webkit-scrollbar-thumb {
  background: var(--bg-tertiary);
  border-radius: var(--radius-full);
}
::-webkit-scrollbar-thumb:hover {
  background: var(--text-dim);
}
/* X.com (Twitter) Black & White Dark Theme Design Tokens */
:root {
  /* Colors - Authentic Black & White Theme */
  --bg-primary: #000000;
  --bg-secondary: #16181c;
  --bg-tertiary: #202327;
  --bg-hover: rgba(239, 243, 244, 0.1);
  --bg-hover-solid: #18191c;
  
  --border-color: #2f3336;
  --border-focus: #e7e9ea;

  --text-main: #f7f9f9;
  --text-muted: #71767b;
  --text-dim: #53575b;

  --accent-color: #ffffff;
  --accent-hover: #d7dbdc;
  --error-color: #f4212e;
  --success-color: #00ba7c;
  --warning-color: #ffd400;
  --blue: #1d9bf0;
  --pink: rgb(239, 27, 87);

  /* Typography */
  --font-main: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;

  /* Layout Boundaries */
  --header-height: 60px;
  --container-max-width: 1260px;

  /* Radii */
  --radius-sm: 4px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-full: 9999px;

  /* Transitions */
  --transition-fast: 0.15s ease-in-out;
  --transition-normal: 0.25s ease-in-out;
}
.overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
}
.add-post-container {
    position: absolute;
    top: 200px;
    left: 50%;
    transform: translateX(-50%);
    background-color: var(--bg-secondary);
    border: 1px solid var(--border-color);
    padding: 10px;
    border-radius: 8px;
    width: 500px;
}
.box-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--border-color);
    margin-bottom: 10px;
    padding-bottom: 10px;
}
.box-header button {
    background-color: var(--bg-hover-solid);
    color: var(--accent-color);
    cursor: pointer;
    padding: 10px;
    border: 1px solid var(--bg-tertiary);
    border-radius: 6px;
    background-color: transparent;
    border: none;
}
.box-header span {
    font-size: 1rem;
    color: var(--blue);
}
.group {
    display: flex;
    gap: 5px;
}
.group .user-avatar {
    width: 40px;
    height: 40px;
    background-color: var(--border-color);
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
}
.inputs {
    width: 100%;
}
textarea {
    width: 100%;
    resize: none;
    background-color: var(--bg-secondary);
    border: none;
    border-bottom: 1px solid var(--border-color);
    height: 100px;
    outline: none;
    padding: 10px;
    color: var(--accent-color);
    font-size: 1.1rem;
    margin-bottom: 10px;
}
.sub-group {
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: relative;
}
.categories button {
    background-color: var(--bg-tertiary);
    border: 1px solid var(--border-color);
    border-radius: 6px;
    cursor: pointer;
    padding: 4px 10px;
    color: var(--accent-color);
}
.inputs .categories-options {
    position: absolute;
    left: 0;
    top: 30px;
    display: flex;
    flex-flow: column wrap;
    background-color: var(--bg-tertiary);
    width: 180px;
    border: 1px solid var(--border-color);
    border-radius: 6px;
    padding: 15px;
    gap: 8px;
    display: none;
}
.inputs .categories-options span {
    position: relative;
}
.inputs .categories-options span:first-of-type::before {
    content: "";
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    left: -10px;
    width: 6px;
    height: 6px;
    background-color: var(--success-color);
    border-radius: 50%;
}
.post-btn {
    background-color: var(--accent-color);
    border: 1px solid var(--border-color);
    color: var(--bg-primary);
    padding: 6px 22px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 1.1rem;
    font-weight: bold;
}
    </style>
</head>

<body>
    <div class="overlay">
        <div class="add-post-container">
            <header class="box-header">
                <button>
                    <i class="fas fa-x"></i>
                </button>
                <span>New Post</span>
            </header>
            <div class="group">
                <div class="user-avatar">U</div>
                <div class="inputs">
                    <textarea name="test" id="test" placeholder="What's happening?"></textarea>
                    <div class="sub-group">
                        <div class="categories">
                        <button><i class="fas fa-layer-group"></i> Select categories</button>
                        <div class="categories-options">
                            <span>Category-one</span>
                            <span>Category-two</span>
                            <span>Category-three</span>
                            <span>Category-four</span>
                        </div>
                    </div>
                    <button class="post-btn">Post</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
